<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — Virgin Aminos</title>
  <meta name="description" content="Browse research peptides by category at Virgin Aminos. High-purity compounds for laboratory research. For Research Use Only.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="hero" style="padding-top:24px;">
    <div class="container">
      <div class="page-banner">
        <div class="breadcrumb" id="crumb">Home / Category</div>
        <h1 id="catTitle">Category</h1>
        <p id="catDesc"></p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="results-count" id="resultsCount"></div>
      <div class="product-grid" id="catGrid"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="disclaimer">
        <strong>Research Use Only.</strong> All compounds are intended strictly for laboratory and research purposes. They are not intended to diagnose, treat, cure, or prevent any disease, and are not for human or veterinary use.
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    initShell("products");
    const params = new URLSearchParams(window.location.search);
    const cat = params.get("cat");
    if (!CATEGORIES.includes(cat)) {
      window.location.replace("products.html");
    } else {
      const label = CATEGORY_LABELS[cat] || cat;
      document.title = label + " — Research Peptides | Virgin Aminos";
      document.getElementById("crumb").textContent = "Home / " + label;
      document.getElementById("catTitle").textContent = label;
      document.getElementById("catDesc").textContent = CATEGORY_DESCRIPTIONS[cat] || "";
      const list = PRODUCTS.filter(p => p.category === cat);
      document.getElementById("resultsCount").textContent =
        list.length === 1 ? "Showing 1 result" : "Showing all " + list.length + " results";
      renderProducts(list, "catGrid");
    }
  </script>
</body>
</html>
